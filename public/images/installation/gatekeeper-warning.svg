<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="100%">
  <defs>
    <linearGradient id="alertBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="100%" stop-color="#141724" />
    </linearGradient>
    <filter id="shadowAlert" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background Desktop Dimmer -->
  <rect x="0" y="0" width="760" height="400" fill="#090a0f" rx="16" />
  
  <!-- macOS Alert Dialog -->
  <rect x="180" y="45" width="400" height="300" rx="18" fill="url(#alertBg)" stroke="#333b52" stroke-width="1.5" filter="url(#shadowAlert)" />

  <!-- App Icon with Warning Badge -->
  <g transform="translate(348, 65)">
    <rect x="0" y="0" width="64" height="64" rx="15" fill="#2f5af6" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <line x1="14" y1="22" x2="50" y2="22" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round" />
    <circle cx="26" cy="22" r="4" fill="#fff" />
    <line x1="14" y1="34" x2="50" y2="34" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round" />
    <circle cx="40" cy="34" r="4" fill="#fff" />
    <line x1="14" y1="46" x2="50" y2="46" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round" />
    <circle cx="30" cy="46" r="4" fill="#fff" />
    
    <!-- Yellow Alert Triangle Badge -->
    <circle cx="56" cy="56" r="13" fill="#f59e0b" stroke="#1e2230" stroke-width="2.5" />
    <text x="56" y="61" fill="#000" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">!</text>
  </g>

  <!-- Dialog Headline -->
  <text x="380" y="160" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    “Device Deck.app” can’t be opened because
  </text>
  <text x="380" y="178" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    Apple cannot check it for malicious software.
  </text>

  <!-- Dialog Description -->
  <text x="380" y="206" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="11.5" text-anchor="middle">
    macOS cannot verify that this app is free from malware.
  </text>
  <text x="380" y="222" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="11.5" text-anchor="middle">
    Right-click (Control-click) to approve opening.
  </text>

  <!-- Action Buttons -->
  <!-- Cancel Button -->
  <rect x="204" y="280" width="166" height="34" rx="8" fill="#262c3e" stroke="#3b4460" stroke-width="1" />
  <text x="287" y="302" fill="#e2e8f0" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Cancel</text>

  <!-- Open Button (Highlighted with Glow) -->
  <rect x="390" y="280" width="166" height="34" rx="8" fill="#2563eb" stroke="#3b82f6" stroke-width="1" />
  <text x="473" y="302" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Open</text>

  <!-- Mouse Cursor Pointer -->
  <g transform="translate(510, 295)">
    <polygon points="0,0 4,14 8,10 13,18 16,16 11,8 16,7" fill="#fff" stroke="#000" stroke-width="1.5" />
  </g>

  <!-- Left Annotation / Hint -->
  <g transform="translate(20, 140)">
    <rect x="0" y="0" width="140" height="90" rx="10" fill="#131622" stroke="#f59e0b" stroke-width="1.5" />
    <text x="14" y="26" fill="#f59e0b" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700">HOW TO OPEN:</text>
    <text x="14" y="46" fill="#cbd5e1" font-family="-apple-system, system-ui, sans-serif" font-size="10">1. Hold Control key</text>
    <text x="14" y="62" fill="#cbd5e1" font-family="-apple-system, system-ui, sans-serif" font-size="10">2. Right-click app</text>
    <text x="14" y="78" fill="#60a5fa" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600">3. Select "Open"</text>
    <line x1="140" y1="45" x2="180" y2="90" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" />
  </g>
</svg>

