<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <linearGradient id="settingsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c2b" />
      <stop offset="100%" stop-color="#10131e" />
    </linearGradient>
    <filter id="shadowSettings" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Settings Window Frame -->
  <rect x="30" y="20" width="700" height="340" rx="16" fill="url(#settingsBg)" stroke="#2b3248" stroke-width="1.5" filter="url(#shadowSettings)" />

  <!-- Window Header -->
  <rect x="30" y="20" width="700" height="44" rx="16" fill="#141724" />
  <rect x="30" y="48" width="700" height="16" fill="#141724" />
  <line x1="30" y1="64" x2="730" y2="64" stroke="#2b3248" stroke-width="1" />

  <!-- Traffic Lights -->
  <circle cx="54" cy="42" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="74" cy="42" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="94" cy="42" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <text x="380" y="47" fill="#cbd5e1" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Privacy &amp; Security</text>

  <!-- Left Sidebar Mini-Mock -->
  <rect x="30" y="64" width="180" height="296" fill="#121520" />
  <line x1="210" y1="64" x2="210" y2="360" stroke="#2b3248" stroke-width="1" />
  <text x="50" y="100" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600">SETTINGS</text>
  <rect x="42" y="112" width="156" height="28" rx="6" fill="#2563eb" />
  <text x="60" y="130" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="500">Privacy &amp; Security</text>
  <text x="60" y="166" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="12">General</text>
  <text x="60" y="196" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="12">Displays</text>
  <text x="60" y="226" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="12">Sound</text>

  <!-- Right Main Area: Security Section -->
  <g transform="translate(240, 85)">
    <!-- Security Title -->
    <text x="0" y="20" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700">Security</text>
    <text x="0" y="44" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="12">Allow applications downloaded from:</text>

    <!-- App Store / Identified Developers radios -->
    <circle cx="10" cy="70" r="5" fill="#3b82f6" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="10" cy="70" r="2.5" fill="#ffffff" />
    <text x="24" y="74" fill="#cbd5e1" font-family="-apple-system, system-ui, sans-serif" font-size="12">App Store and identified developers</text>

    <!-- Blocked App Card with "Open Anyway" Button -->
    <rect x="0" y="100" width="460" height="96" rx="10" fill="#1b2030" stroke="#3b4460" stroke-width="1.5" />
    
    <!-- Shield Alert Icon -->
    <g transform="translate(18, 122)">
      <circle cx="16" cy="16" r="16" fill="#f59e0b" fill-opacity="0.2" />
      <path d="M 16 6 L 24 10 L 24 18 Q 24 24 16 27 Q 8 24 8 18 L 8 10 Z" fill="#f59e0b" />
    </g>

    <!-- Card Text -->
    <text x="62" y="128" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600">
      “Device Deck.app” was blocked from use
    </text>
    <text x="62" y="146" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="11">
      because it is not from an identified developer.
    </text>

    <!-- "Open Anyway" Blue Button -->
    <rect x="330" y="132" width="115" height="32" rx="7" fill="#2563eb" stroke="#3b82f6" stroke-width="1" />
    <text x="387" y="152" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Open Anyway</text>

    <!-- Mouse Pointer on Button -->
    <g transform="translate(420, 146)">
      <polygon points="0,0 4,14 8,10 13,18 16,16 11,8 16,7" fill="#fff" stroke="#000" stroke-width="1.5" />
    </g>

    <!-- Step Description Subtitle -->
    <text x="0" y="224" fill="#60a5fa" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600">
      Click "Open Anyway" and enter your Mac password or Touch ID to launch.
    </text>
  </g>
</svg>

