<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c2b" />
      <stop offset="100%" stop-color="#0f121d" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Finder Window Frame -->
  <rect x="20" y="20" width="720" height="340" rx="16" fill="url(#bgGrad)" stroke="#2b3248" stroke-width="1.5" filter="url(#shadow)" />
  
  <!-- Window Header -->
  <rect x="20" y="20" width="720" height="42" rx="16" fill="#141724" />
  <rect x="20" y="46" width="720" height="16" fill="#141724" />
  <line x1="20" y1="62" x2="740" y2="62" stroke="#2b3248" stroke-width="1" />

  <!-- Traffic Lights -->
  <circle cx="44" cy="41" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="64" cy="41" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="84" cy="41" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Window Title -->
  <text x="380" y="46" fill="#9ca3af" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Device Deck 1.5.1</text>

  <!-- Left: Device Deck App Icon -->
  <g transform="translate(140, 110)">
    <rect x="0" y="0" width="110" height="110" rx="24" fill="#2f5af6" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
    <line x1="24" y1="38" x2="86" y2="38" stroke="rgba(255,255,255,0.6)" stroke-width="5" stroke-linecap="round" />
    <circle cx="42" cy="38" r="7" fill="#fff" />
    <line x1="24" y1="58" x2="86" y2="58" stroke="rgba(255,255,255,0.6)" stroke-width="5" stroke-linecap="round" />
    <circle cx="68" cy="58" r="7" fill="#fff" />
    <line x1="24" y1="78" x2="86" y2="78" stroke="rgba(255,255,255,0.6)" stroke-width="5" stroke-linecap="round" />
    <circle cx="50" cy="78" r="7" fill="#fff" />
    <text x="55" y="140" fill="#f3f4f6" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Device Deck.app</text>
  </g>

  <!-- Middle: Curved Drag Arrow -->
  <g transform="translate(290, 150)">
    <path d="M 10 20 Q 90 -20 160 15" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6 6" />
    <polygon points="160,15 145,8 152,22" fill="#3b82f6" />
    <rect x="50" y="-12" width="80" height="22" rx="11" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="90" y="3" fill="#60a5fa" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DRAG</text>
  </g>

  <!-- Right: Applications Folder Icon -->
  <g transform="translate(510, 110)">
    <!-- Blue macOS Folder Silhouette -->
    <path d="M 10 20 L 40 20 L 50 32 L 100 32 Q 105 32 105 37 L 105 95 Q 105 100 100 100 L 10 100 Q 5 100 5 95 L 5 25 Q 5 20 10 20 Z" fill="#2563eb" />
    <rect x="5" y="36" width="100" height="66" rx="6" fill="#3b82f6" />
    <!-- 'A' Application Glyph -->
    <circle cx="55" cy="68" r="20" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="3" />
    <path d="M 45 80 L 55 56 L 65 80 M 48 73 L 62 73" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="55" y="140" fill="#f3f4f6" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Applications</text>
  </g>

  <!-- Step Banner Footer -->
  <rect x="180" y="295" width="400" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="380" y="316" fill="#e2e8f0" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Step 1: Drag Device Deck into your Applications folder</text>
</svg>

